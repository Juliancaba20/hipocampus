[package]
name = "teclado-cientifico"
version = "2.0.0"
description = "Teclado Científico: letras griegas y símbolos para escribir en cualquier programa"
edition = "2021"
publish = false

[lib]
name = "teclado_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
tauri = { version = "2.12", features = ["macos-private-api", "tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-single-instance = "2.5"
tauri-plugin-global-shortcut = "2"
auto-launch = "0.6"
tauri-plugin-clipboard-manager = "2"
enigo = "0.6"

[target.'cfg(windows)'.dependencies]
# Para quitar el teclado de la lista de Alt+Tab (estilo «ventana de herramientas»).
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }

[features]
# Lo activa la compilación final: la ventana carga la interfaz incluida en el programa.
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
